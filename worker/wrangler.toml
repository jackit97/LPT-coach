name = "lpt-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Set these with `wrangler secret put <NAME>` (never commit real values):
#   DATABASE_URL   -> Neon (or any) Postgres connection string (postgresql://...sslmode=require)
#   JWT_SECRET     -> random long string used to sign auth tokens
#   DB_SCHEMA      -> optional Postgres schema (set to "lptapp" to reuse the old LPTapp schema)
#
# Alternative to DATABASE_URL (same convention as the old Express backend):
# set PGHOST / PGDATABASE / PGUSER / PGPASSWORD / PGPORT / PGSSL individually
# and the worker will build the connection string for you.
#
# The worker boots and responds even if none of these are set yet (routes that
# touch the DB return a clean 503 instead of crashing) - same tolerant startup
# behaviour as the old backend's DB_ALLOW_START_WITHOUT_DB.
#
# vars below are non-secret defaults, override per environment as needed.
[vars]
CORS_ORIGIN = "*"
DB_SCHEMA = "lptapp"
APP_URL = "https://lpt-coach.pages.dev"
# Email (verifica indirizzo + notifiche). Provider: "brevo" (consigliato, basta verificare l'indirizzo mittente)
# oppure "resend" (serve un dominio). La chiave va come secret: npx wrangler secret put EMAIL_API_KEY
EMAIL_PROVIDER = "brevo"
EMAIL_FROM = "filippocavallini.coach@gmail.com"
EMAIL_FROM_NAME = "LPT Coach"

[observability]
enabled = true

# Foto dei check (consigliato): crea il bucket con `npx wrangler r2 bucket create lpt-check-photos`
# e poi togli il commento qui sotto. Senza bucket le foto vengono salvate nel database.
[[r2_buckets]]
binding = "CHECK_PHOTOS"
bucket_name = "lpt-check-photos"
